initial: DISABLE_OBJECT_DETECTION
states:
  DISABLE_OBJECT_DETECTION:
    action:
      type: EnableObjectDetection
      camera_topic: all
      enable: false
  DISABLE_STABILIZATION:
    action:
      type: EnableStabilization
      depth: false
      roll: false
      pitch: false
      yaw: false
  DEPTHZERO:
    action: 
      type: Twist
      surge: 0.0
      sway: 0.0
      depth: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
      duration: 1.0
transitions:
  - { trigger: ok, source: DISABLE_OBJECT_DETECTION, dest: DISABLE_STABILIZATION }
  - { trigger: ok, source: DISABLE_STABILIZATION, dest: DEPTHZERO }
  - { trigger: ok, source: DEPTHZERO, dest: OK }
